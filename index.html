/* ── 날짜 ── */
const pad = n => String(n).padStart(2,"0");
const ymOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const dsOf = d => `${ymOf(d)}-${pad(d.getDate())}`;
const fmtTime = t => new Date(t).toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});

/* ── 전역 상태 ── */
const S = {
  room: null,          // {code, users:[{id,name,emoji}]}
  me: null,            // 'a' | 'b'
  months: {},          // 'YYYY-MM' -> { 'YYYY-MM-DD': { a:{m:{...},e:{...}}, b:{...} } }
  view: (()=>{ const d=new Date(); return {y:d.getFullYear(), m:d.getMonth()}; })(),

const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ── 토스트 ── */
let toastTimer;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.remove(), 2400);
}

/* ── DB ── */
async function fetchRoom(code){
  const { data } = await sb.from("rooms").select().eq("code", code).maybeSingle();
  return data;
}
async function loadMonth(ym){
  const { data, error } = await sb.from("checkins")
    .select().eq("room", S.room.code).like("date", ym + "%");
  if (error) { console.error(error); return; }
  const map = {};
  for (const r of (data||[])) {
    map[r.date] = map[r.date] || {};
    map[r.date][r.uid] = map[r.date][r.uid] || {};
    map[r.date][r.uid][r.slot] = { t:Number(r.t), rx:r.rx||null, photo:r.photo_url||null };
  }
  S.months[ym] = map;
}
async function refreshCurrent(){
  const now = new Date();
  const prev = new Date(now.getFullYear(), now.getMonth()-1, 1);
  await Promise.all([loadMonth(ymOf(now)), loadMonth(ymOf(prev))]);
}

/* ── 사진 압축 ── */
function compress(file){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const MAX = 900;
      let w = img.width, h = img.height;
      const s = Math.min(1, MAX/Math.max(w,h));
      w = Math.round(w*s); h = Math.round(h*s);
      const cv = document.createElement("canvas");
      cv.width=w; cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      cv.toBlob(b => b ? resolve(b) : reject(new Error("압축 실패")), "image/jpeg", 0.72);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("이미지를 읽지 못했어요")); };
    img.src = url;
  });
}

/* ── 체크인 (date 생략 시 오늘, 과거 날짜 인증도 지원) ── */
async function checkIn(slot, file, date){
  date = date || dsOf(new Date());
  const isToday = date === dsOf(new Date());
  S.busySlot = slot; render();
  if (!isToday) toast("업로드 중… ⏳");
  try {
    const blob = await compress(file);
    const path = `${S.room.code}/${date}_${S.me}_${slot}.jpg`;
    const { error: upErr } = await sb.storage.from("photos")
      .upload(path, blob, { upsert:true, contentType:"image/jpeg" });
    if (upErr) throw new Error("사진 업로드 실패: " + upErr.message);
    const { data:{ publicUrl } } = sb.storage.from("photos").getPublicUrl(path);
    const { error: dbErr } = await sb.from("checkins").upsert({
      id: `${S.room.code}:${date}:${S.me}:${slot}`,
      room: S.room.code, date, uid: S.me, slot,
      t: Date.now(), photo_url: publicUrl + "?v=" + Date.now(), rx: null,
    });
    if (dbErr) throw new Error("저장 실패: " + dbErr.message);
    await loadMonth(date.slice(0,7));
    const label = isToday ? "" : `${Number(date.slice(5,7))}월 ${Number(date.slice(8,10))}일 `;
    toast(label + (slot==="m" ? "아침 인증 완료! 🌅" : "저녁 인증 완료! 🌙"));
  } catch(e){ toast("⚠️ " + e.message); }
  S.busySlot = null; render();
}

async function deleteCheckIn(slot, date){
  date = date || dsOf(new Date());
  await sb.from("checkins").delete().eq("id", `${S.room.code}:${date}:${S.me}:${slot}`);
  await sb.storage.from("photos").remove([`${S.room.code}/${date}_${S.me}_${slot}.jpg`]);
  await loadMonth(date.slice(0,7));
  toast("인증을 지웠어요"); render();
}

async function react(uid, slot, emoji){
  const date = dsOf(new Date());
  const cur = (((S.months[date.slice(0,7)]||{})[date]||{})[uid]||{})[slot];
  if (!cur) return;
  const next = cur.rx === emoji ? null : emoji;
  await sb.from("checkins").update({ rx: next })
    .eq("id", `${S.room.code}:${date}:${uid}:${slot}`);
  cur.rx = next; render();
}

/* ── 특정 주(월~일)의 인증한 날 수. weeksAgo=0 이번 주, 1 지난 주 ── */
function weekCountOffset(uid, weeksAgo){
  const now = new Date();
  const dow = (now.getDay() + 6) % 7; // 월요일=0
  const monday = new Date(now); monday.setDate(now.getDate() - dow - 7*weeksAgo);
  const end = weeksAgo === 0 ? dow : 6; // 이번 주는 오늘까지만
  let cnt = 0;
  for (let i=0; i<=end; i++){
    const d = new Date(monday); d.setDate(monday.getDate()+i);
    const day = ((S.months[ymOf(d)]||{})[dsOf(d)]||{})[uid];
    if (day && (day.m || day.e)) cnt++;
  }
  return cnt;
}
function weekCount(uid){ return weekCountOffset(uid, 0); }

/* ── 이번 주 커피 당번: 지난 주 목표 미달자 ── */
function dutyHTML(){
  const now = new Date();
  const dow = (now.getDay() + 6) % 7;
  const lastMonday = new Date(now);
  lastMonday.setDate(now.getDate() - dow - 7);
  lastMonday.setHours(0,0,0,0);
  /* 챌린지를 지난 주 도중이나 이후에 시작했으면 첫 주는 당번 없음 */
  if (!S.room.created_at) return "";
  const created = new Date(S.room.created_at);
  if (created > lastMonday) return "";
  const losers = S.room.users.filter(u => weekCountOffset(u.id, 1) < WEEKLY_GOAL);
  if (losers.length === 0){
    return `<div style="margin-top:8px;background:#3BA55D14;border:1.5px solid #3BA55D55;border-radius:12px;
      padding:10px 14px;text-align:center" class="jua">
      🎉 지난 주 둘 다 목표 달성! 이번 주 당번 없음</div>`;
  }
  return `<div style="margin-top:8px;background:var(--ink);border-radius:12px;padding:12px 14px;text-align:center">
    <div style="color:#B8AB98;font-size:12px">☕ 이번 주 커피 당번 <span style="font-size:11px">(지난 주 목표 미달)</span></div>
    <div class="jua" style="color:var(--sun);font-size:17px;margin-top:2px">
      ${losers.map(u=>`${u.emoji} ${esc(u.name)} (${weekCountOffset(u.id,1)}/${WEEKLY_GOAL})`).join(" · ")}
    </div>
  </div>`;
}

/* ── 스트릭 ── */
function streakOf(uid){
  let n = 0;
  const d = new Date();
  for (let i=0;i<120;i++){
    const month = S.months[ymOf(d)];
    if (!month) break;
    const day = (month[dsOf(d)]||{})[uid];
    const has = day && (day.m || day.e);
    if (has) n++;
    else if (i>0) break; /* 오늘은 아직 안 했어도 스트릭 유지 */
    d.setDate(d.getDate()-1);
  }
  return n;
}

        color:${color};font-family:'Jua';font-size:15px">${busy?"올리는 중…":"📸 사진 인증하기"}</button>`;
  } else {
    body = `<div style="height:78px;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px">아직 안 했어요 💤</div>`;
  }
  return `
  <div class="slot ${entry?"":"slot-empty"}" style="${entry?`background:${color}0E`:""}">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
      <span style="font-size:13px">${icon}</span>
      <span style="font-size:12px;font-weight:700;color:var(--sub)">${label}</span>
      ${entry?`<span style="margin-left:auto;font-size:11px;color:${color};font-weight:700">${fmtTime(entry.t)}</span>`:""}
    </div>${body}
  </div>`;
}

/* ── 메인 ── */
function renderMain(){
  const now = new Date();
  const todayStr = dsOf(now);
  const curYm = ymOf(now);
  const todayData = (S.months[curYm]||{})[todayStr] || {};
  const bothMorning = todayData.a?.m && todayData.b?.m;
  const meUser = S.room.users.find(u=>u.id===S.me);
  const partner = S.room.users.find(u=>u.id!==S.me);
  const ordered = [meUser, partner];

  const viewYm = `${S.view.y}-${pad(S.view.m+1)}`;
  const viewData = S.months[viewYm] || {};
  const firstDow = new Date(S.view.y, S.view.m, 1).getDay();
  const daysInMonth = new Date(S.view.y, S.view.m+1, 0).getDate();

  app.innerHTML = `
  <header style="padding:22px 20px 8px">
    <div style="display:flex;align-items:center">
      <div>
        <div class="sub" style="font-size:12px;letter-spacing:2px">OUR CHALLENGE</div>
        <h1 style="font-size:26px;margin-top:2px">우리 운동 <span style="color:var(--sun)">☀️</span></h1>
      </div>
      <button id="btn-settings" aria-label="설정" style="margin-left:auto;background:none;border:none;font-size:20px">⚙️</button>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      ${ordered.map(u=>`
        <div style="flex:1;background:${pcHex(u.id)}12;border:1.5px solid ${pcHex(u.id)}33;border-radius:12px;
          padding:8px 12px;display:flex;align-items:center;gap:8px">
          <span style="font-size:20px">${u.emoji}</span>
          <div>
            <div style="font-size:12px;font-weight:700;color:${pc(u.id)}">${esc(u.name)}${u.id===S.me?'<span class="sub" style="font-weight:400"> (나)</span>':""}</div>
            <div style="font-size:13px;font-weight:800">🔥 ${streakOf(u.id)}일 연속</div>
            <div style="font-size:12px;font-weight:700;color:${weekCount(u.id)>=WEEKLY_GOAL?"#3BA55D":"var(--sub)"}">🎯 이번 주 ${weekCount(u.id)}/${WEEKLY_GOAL}회${weekCount(u.id)>=WEEKLY_GOAL?" ✅":""}</div>
          </div>
        </div>`).join("")}
    </div>
    ${dutyHTML()}
  </header>

  <section class="card">
    <div style="display:flex;align-items:baseline;gap:8px">
      <h2 style="font-size:18px">오늘</h2>
      <span class="sub" style="font-size:13px">${now.getMonth()+1}월 ${now.getDate()}일 (${KO_DAYS[now.getDay()]})</span>
      <button id="btn-refresh" aria-label="새로고침" style="margin-left:auto;background:none;border:none;font-size:15px">🔄</button>
    </div>
    ${bothMorning?`<div class="jua" style="margin-top:10px;background:linear-gradient(90deg,#FF6B4A18,#12A59418);
      border:1.5px solid var(--sun);border-radius:12px;padding:8px 12px;text-align:center;font-size:15px">🎉 오늘 아침, 둘 다 성공!</div>`:""}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px">
      ${ordered.map(u=>`
        <div>
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px">
            <span style="font-size:18px">${u.emoji}</span>
            <span class="jua" style="font-size:15px;color:${pc(u.id)}">${esc(u.name)}</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px">
            ${slotHTML(u,"m",(todayData[u.id]||{}).m)}
            ${slotHTML(u,"e",(todayData[u.id]||{}).e)}
          </div>
        </div>`).join("")}
    </div>
  </section>

  <section class="card" style="margin-bottom:24px">
    <div style="display:flex;align-items:center;margin-bottom:10px">
      <button id="cal-prev" aria-label="이전 달" style="width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#FFF;font-size:18px">‹</button>
      <div class="jua" style="flex:1;text-align:center;font-size:17px">${S.view.y}년 ${S.view.m+1}월</div>
      <button id="cal-next" aria-label="다음 달" style="width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#FFF;font-size:18px">›</button>
    </div>
    <div class="cal-grid" style="font-size:11px;text-align:center;margin-bottom:4px">
      ${KO_DAYS.map((d,i)=>`<div style="color:${i===0?"#D66":i===6?"#57A":"var(--sub)"}">${d}</div>`).join("")}
    </div>
    <div class="cal-grid">
      ${Array.from({length:firstDow}).map(()=>"<div></div>").join("")}
      ${Array.from({length:daysInMonth}).map((_,i)=>{
        const ds = `${viewYm}-${pad(i+1)}`;
        const day = viewData[ds] || {};
        const aDone = day.a && (day.a.m||day.a.e);
        const bDone = day.b && (day.b.m||day.b.e);
        const both = day.a?.m && day.b?.m;
        const isToday = ds === todayStr;
        const clickable = ds <= todayStr; /* 과거·오늘은 열어서 인증 추가/보기 가능 */
        return `<button class="cal-day" data-ds="${ds}" ${clickable?"":"disabled"}
          style="aspect-ratio:1;border-radius:10px;border:${isToday?"2px solid var(--sun)":"1px solid var(--line)"};
          background:${both?"#FFB02018":"#FFFDF8"};display:flex;flex-direction:column;align-items:center;
          justify-content:center;gap:3px;padding:0;cursor:${clickable?"pointer":"default"};opacity:${clickable?1:.45}">
          <span style="font-size:11px;font-weight:${isToday?800:500}">${i+1}</span>
          <span style="display:flex;gap:2px">
            <span class="dot" style="background:${aDone?"#FF6B4A":"#E8DFCF"}"></span>
            <span class="dot" style="background:${bDone?"#12A594":"#E8DFCF"}"></span>
          </span>
          ${both?'<span style="font-size:8px;line-height:1">⭐</span>':""}
        </button>`;
      }).join("")}
    </div>
    <div style="display:flex;gap:12px;margin-top:10px;font-size:11px;justify-content:center" class="sub">
      ${ordered.map(u=>`<span style="display:flex;align-items:center;gap:4px"><span class="dot" style="background:${pcHex(u.id)}"></span> ${esc(u.name)}</span>`).join("")}
      <span>⭐ 둘 다 아침 성공</span>
    </div>
  </section>
  ${S.dayModal ? dayModalHTML(S.dayModal) : ""}
  ${S.showSettings ? settingsHTML() : ""}`;

  bindMain();
}

function dayModalHTML(ds){
  const ymm = ds.slice(0,7);
  const day = (S.months[ymm]||{})[ds] || {};
  const isToday = ds === dsOf(new Date());
  return `<div class="modal-bg" id="modal-bg"><div class="modal">
    <h3 style="margin-bottom:4px">${Number(ds.slice(5,7))}월 ${Number(ds.slice(8,10))}일</h3>
    ${!isToday?`<p class="sub" style="font-size:12px;margin-bottom:10px">깜빡한 날의 인증도 여기서 올릴 수 있어요 📸</p>`:'<div style="margin-bottom:10px"></div>'}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      ${S.room.users.map(u=>{
        const d = day[u.id] || {};
        const isMe = u.id === S.me;
        return `<div>
          <div class="jua" style="color:${pc(u.id)};margin-bottom:6px">${u.emoji} ${esc(u.name)}</div>
          ${["m","e"].map(s=>{
            const e = d[s];
            const slotName = s==="m"?"🌅 아침":"🌙 저녁";
            if (e) return `<div style="margin-bottom:10px">
              <div class="sub" style="font-size:11px;margin-bottom:3px;display:flex;align-items:center">${slotName} · ${fmtTime(e.t)}${e.rx?" · "+e.rx:""}
                ${isMe?`<button class="del-btn-past" data-slot="${s}" data-ds="${ds}" style="margin-left:auto;font-size:10px;color:var(--sub);background:none;border:none;text-decoration:underline">삭제</button>`:""}
              </div>
              <img src="${esc(e.photo||"")}" alt="" style="width:100%;border-radius:10px"/>
            </div>`;
            if (isMe) return `<div style="margin-bottom:10px">
              <input type="file" accept="image/*" class="file-in-past" data-slot="${s}" data-ds="${ds}" style="display:none"/>
              <button class="shoot-btn-past" data-slot="${s}" data-ds="${ds}"
                style="width:100%;padding:12px 0;border-radius:10px;border:2px dashed ${pcHex(u.id)}66;background:#FFF;
                color:${pcHex(u.id)};font-family:'Jua';font-size:13px">${slotName} 📸 인증 올리기</button>
            </div>`;
            return `<div class="sub" style="font-size:12px;margin-bottom:10px">${slotName} — 기록 없음</div>`;
          }).join("")}
        </div>`;
      }).join("")}
    </div>
    <button id="modal-close" class="btn-primary" style="margin-top:14px;background:var(--ink);color:#FFF">닫기</button>
  </div></div>`;
}

function settingsHTML(){
  return `<div class="modal-bg" id="modal-bg"><div class="modal">
    <h3 style="margin-bottom:12px">설정</h3>
    <div style="margin-bottom:14px">
      <div class="sub" style="font-size:12px;margin-bottom:8px">프로필 (이모지·이름 바꾸기)</div>
      ${S.room.users.map(u=>`
        <div style="margin-bottom:10px">
          <div style="font-size:12px;color:${pc(u.id)};font-weight:700;margin-bottom:4px">${u.id===S.me?"나":"상대"}</div>
          <div style="display:flex;gap:8px">
            <select class="emo-sel" data-id="${u.id}" style="font-size:18px;border-radius:10px;border:1px solid var(--line);background:#FFF;padding:4px">
              ${EMOJIS.map(e=>`<option value="${e}" ${u.emoji===e?"selected":""}>${e}</option>`).join("")}
            </select>
            <input class="name-in input" data-id="${u.id}" value="${esc(u.name)}" maxlength="8" style="flex:1"/>
          </div>
        </div>`).join("")}
      <button id="save-profile" style="width:100%;padding:11px;border-radius:12px;border:none;background:var(--sun);font-family:'Jua';font-size:15px;color:var(--ink)">프로필 저장</button>
    </div>
    <div class="sub" style="font-size:13px;margin-bottom:12px;border-top:1px solid var(--line);padding-top:12px">
      커플 코드: <b style="color:var(--ink)">${esc(S.room.code)}</b>
      <button id="copy-code" style="margin-left:6px;font-size:11px;border:1px solid var(--line);border-radius:8px;background:#FFF;padding:2px 8px">복사</button>
      <br/>여자친구는 같은 사이트에서 이 코드로 참여하면 돼요.
    </div>
    <div style="border-top:1px solid var(--line);padding-top:12px">
      <div class="sub" style="font-size:12px;margin-bottom:8px">이 기기의 사용자 바꾸기</div>
      <div style="display:flex;gap:8px">
        ${S.room.users.map(u=>`
          <button class="switch-me" data-id="${u.id}" style="flex:1;padding:10px;border-radius:12px;font-size:14px;background:${u.id===S.me?pcHex(u.id)+"12":"#FFF"};
            border:${u.id===S.me?`2px solid ${pcHex(u.id)}`:"1px solid var(--line)"}">${u.emoji} ${esc(u.name)}</button>`).join("")}
      </div>
      <button id="leave-room" style="width:100%;margin-top:14px;padding:10px;border-radius:12px;border:1px solid var(--line);background:#FFF;color:var(--sub);font-size:13px">이 기기에서 로그아웃</button>
    </div>
    <button id="modal-close" class="btn-primary" style="margin-top:14px;background:var(--ink);color:#FFF">닫기</button>
  </div></div>`;
}

/* ── 이벤트 바인딩 ── */
function bindMain(){
  app.querySelectorAll(".shoot-btn").forEach(b=> b.onclick = ()=>{
    app.querySelector(`.file-in[data-slot="${b.dataset.slot}"]`).click();
  });
  app.querySelectorAll(".file-in").forEach(inp=> inp.onchange = e=>{
    const f = e.target.files && e.target.files[0];
    if (f) checkIn(inp.dataset.slot, f);
    e.target.value = "";
  });
  app.querySelectorAll(".del-btn").forEach(b=> b.onclick = ()=>{
    if (confirm("오늘 인증을 삭제할까요?")) deleteCheckIn(b.dataset.slot);
  });
  app.querySelectorAll(".rx-btn").forEach(b=> b.onclick = ()=> react(b.dataset.uid, b.dataset.slot, b.dataset.emo));
  /* 하루 상세 모달: 과거 날짜 인증 추가/삭제 */
  app.querySelectorAll(".shoot-btn-past").forEach(b=> b.onclick = ()=>{
    app.querySelector(`.file-in-past[data-slot="${b.dataset.slot}"][data-ds="${b.dataset.ds}"]`).click();
  });
  app.querySelectorAll(".file-in-past").forEach(inp=> inp.onchange = e=>{
    const f = e.target.files && e.target.files[0];
    if (f) checkIn(inp.dataset.slot, f, inp.dataset.ds);
    e.target.value = "";
  });
  app.querySelectorAll(".del-btn-past").forEach(b=> b.onclick = ()=>{
    if (confirm("이 인증을 삭제할까요?")) deleteCheckIn(b.dataset.slot, b.dataset.ds);
  });
  app.querySelectorAll(".cal-day").forEach(b=> b.onclick = ()=>{ S.dayModal = b.dataset.ds; render(); });
  const prev = document.getElementById("cal-prev");
  const next = document.getElementById("cal-next");
  if (prev) prev.onclick = async ()=>{ navMonth(-1); };
  if (next) next.onclick = async ()=>{ navMonth(1); };
  const refresh = document.getElementById("btn-refresh");
  if (refresh) refresh.onclick = async ()=>{ await refreshCurrent(); render(); toast("새로고침 완료"); };
  const settings = document.getElementById("btn-settings");
  if (settings) settings.onclick = ()=>{ S.showSettings = true; render(); };
  const bg = document.getElementById("modal-bg");
  if (bg){
    bg.onclick = e=>{ if (e.target === bg){ S.dayModal=null; S.showSettings=false; render(); } };
    const close = document.getElementById("modal-close");
    if (close) close.onclick = ()=>{ S.dayModal=null; S.showSettings=false; render(); };
  }
  const copyBtn = document.getElementById("copy-code");
  if (copyBtn) copyBtn.onclick = ()=>{ navigator.clipboard.writeText(S.room.code).then(()=>toast("코드를 복사했어요")); };
  const saveProfile = document.getElementById("save-profile");
  if (saveProfile) saveProfile.onclick = async ()=>{
    const users = S.room.users.map(u=>({
      id: u.id,
      name: (app.querySelector(`.name-in[data-id="${u.id}"]`).value.trim() || u.name).slice(0,8),
      emoji: app.querySelector(`.emo-sel[data-id="${u.id}"]`).value,
    }));
    const { error } = await sb.from("rooms").update({ users }).eq("code", S.room.code);
    if (error) return toast("⚠️ 저장 실패: " + error.message);
    S.room.users = users;
    S.showSettings = false; render();
    toast("프로필을 저장했어요 ✨");
  };
  app.querySelectorAll(".switch-me").forEach(b=> b.onclick = ()=>{
    S.me = b.dataset.id; localStorage.setItem("gu_me", S.me);
    S.showSettings = false; render();
  });
  const leave = document.getElementById("leave-room");
  if (leave) leave.onclick = ()=>{
    localStorage.removeItem("gu_room"); localStorage.removeItem("gu_me");
    S.room = null; S.me = null; render();
  };
}

async function navMonth(dir){
  const d = new Date(S.view.y, S.view.m + dir, 1);
  S.view = { y:d.getFullYear(), m:d.getMonth() };
  const ym = ymOf(d);
  if (!S.months[ym]) await loadMonth(ym);
  render();
}

/* ── 시작 ── */
(async function init(){
  if (SUPABASE_URL.startsWith("여기에")) return render();
  const code = localStorage.getItem("gu_room");
  if (code){
    S.room = await fetchRoom(code);
    if (S.room){
      const me = localStorage.getItem("gu_me");
      if (me === "a" || me === "b") S.me = me;
      if (S.me) await refreshCurrent();
    } else {
      localStorage.removeItem("gu_room");
    }
  }
  render();
  /* 25초마다 & 화면 복귀 시 자동 동기화 */
  setInterval(async ()=>{
    if (S.room && S.me && !S.busySlot){
      const fresh = await fetchRoom(S.room.code);
      if (fresh) S.room = fresh; /* 상대가 바꾼 프로필도 반영 */
      await refreshCurrent();
      if(!S.dayModal && !S.showSettings) render();
    }
  }, 25000);
  document.addEventListener("visibilitychange", async ()=>{
    if (document.visibilityState==="visible" && S.room && S.me){ await refreshCurrent(); render(); }
  });
})();
</script>
</body>
</html>
